name: CLI Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Test CLI
        run: cargo test --locked -p bitgarth-cli

      - name: Build CLI
        run: cargo build --locked --release -p bitgarth-cli --target ${{ matrix.target }}

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="bitgarth-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz"
          mkdir -p dist
          tar \
            -C "target/${{ matrix.target }}/release" \
            -czf "dist/${asset}" \
            bitgarth
          test "$(tar -tzf "dist/${asset}")" = "bitgarth"
          extract_dir="$(mktemp -d)"
          tar -xzf "dist/${asset}" -C "${extract_dir}"
          test -x "${extract_dir}/bitgarth"

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "bitgarth-$env:GITHUB_REF_NAME-${{ matrix.asset_suffix }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath "target/${{ matrix.target }}/release/bitgarth.exe" -DestinationPath "dist/$asset"
          $entries = @(tar -tf "dist/$asset")
          if ($entries.Count -ne 1 -or $entries[0] -ne "bitgarth.exe") {
            throw "unexpected ZIP contents: $entries"
          }

      - name: Upload packaged CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish CLI release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged CLIs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          notes="docs/release-notes/${version}.md"
          test -f "$notes"

          archives=(
            "bitgarth-${tag}-linux-x86_64-gnu.tar.gz"
            "bitgarth-${tag}-macos-aarch64.tar.gz"
            "bitgarth-${tag}-windows-x86_64-msvc.zip"
          )
          mapfile -t archives < <(
            printf '%s\n' "${archives[@]}" | LC_ALL=C sort
          )
          expected="$(printf '%s\n' "${archives[@]}")"
          actual="$(
            find dist -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )"
          if [[ "$actual" != "$expected" ]]; then
            printf 'expected assets:\n%s\nactual assets:\n%s\n' \
              "$expected" "$actual" >&2
            exit 1
          fi

          (
            cd dist
            sha256sum "${archives[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          assets=()
          for archive in "${archives[@]}"; do
            assets+=("dist/${archive}")
          done
          assets+=(dist/SHA256SUMS)

          if release_draft="$(
            gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            gh release edit "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$notes"
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "$tag" \
              --notes-file "$notes"
            release_draft=true
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          if [[ "$release_draft" == "true" ]]; then
            gh release edit "$tag" --draft=false
          fi
