name: CLI Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64-gnu
            artifact_name: cli-x86_64-unknown-linux-gnu
            allow_failure: false
          - os: macos-15
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            artifact_name: unsigned-cli-aarch64-apple-darwin
            allow_failure: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64-msvc
            artifact_name: cli-x86_64-pc-windows-msvc
            allow_failure: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Test CLI
        run: cargo test --locked -p bitgarth-cli

      - name: Build CLI
        run: cargo build --locked --release -p bitgarth-cli --target ${{ matrix.target }}

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="bitgarth-cli-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz"
          mkdir -p dist
          tar \
            -C "target/${{ matrix.target }}/release" \
            -czf "dist/${asset}" \
            bitgarth
          test "$(tar -tzf "dist/${asset}")" = "bitgarth"
          extract_dir="$(mktemp -d)"
          tar -xzf "dist/${asset}" -C "${extract_dir}"
          test -x "${extract_dir}/bitgarth"

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "bitgarth-cli-$env:GITHUB_REF_NAME-${{ matrix.asset_suffix }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath "target/${{ matrix.target }}/release/bitgarth.exe" -DestinationPath "dist/$asset"
          $entries = @(tar -tf "dist/$asset")
          if ($entries.Count -ne 1 -or $entries[0] -ne "bitgarth.exe") {
            throw "unexpected ZIP contents: $entries"
          }

      - name: Upload packaged CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  sign_macos:
    name: Sign macOS CLI
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - name: Download unsigned macOS CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-cli-aarch64-apple-darwin
          path: unsigned

      - name: Import macOS signing certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          keychain: bitgarth-signing
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Sign macOS CLI
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="bitgarth-signing.keychain"
          identity="Developer ID Application: FernTrail B.V. (4UJZ75B7VG)"

          security find-identity -v -p codesigning "$keychain_path"

          archive="$(find unsigned -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          work_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$work_dir"
          binary="$work_dir/bitgarth"
          test -x "$binary"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --identifier tech.ferntrail.bitgarth.cli \
            --keychain "$keychain_path" \
            --sign "$identity" \
            "$binary"
          codesign --verify --strict --verbose=4 "$binary"

          mkdir -p signed
          tar -C "$work_dir" -czf "signed/$(basename "$archive")" bitgarth

      - name: Upload signed macOS CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-aarch64-apple-darwin
          path: signed/*
          if-no-files-found: error
          retention-days: 14

  notarize_macos:
    name: Notarize macOS CLI
    needs: sign_macos
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - name: Download signed macOS CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-aarch64-apple-darwin
          path: signed

      - name: Notarize macOS CLI
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$api_key_path"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"

          archive="$(find signed -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          work_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$work_dir"
          binary="$work_dir/bitgarth"
          test -x "$binary"

          if codesign --verify \
            --verbose=4 \
            --test-requirement '=notarized' \
            --check-notarization \
            "$binary"
          then
            echo "Apple notarization ticket is already available"
            exit 0
          fi

          submission="$RUNNER_TEMP/bitgarth-notary.zip"
          submission_result="$RUNNER_TEMP/bitgarth-notary-submission.json"
          ditto -c -k --keepParent "$binary" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$submission_result"
          cat "$submission_result"
          submission_id="$(plutil -extract id raw -o - "$submission_result")"

          set +e
          xcrun notarytool wait "$submission_id" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          notarization_exit=$?
          set -e

          if ! xcrun notarytool log "$submission_id" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"; then
            echo "::warning::Unable to fetch notarization log for $submission_id"
          fi
          if (( notarization_exit != 0 )); then
            exit "$notarization_exit"
          fi

          codesign --verify \
            --verbose=4 \
            --test-requirement '=notarized' \
            --check-notarization \
            "$binary"

  release:
    name: Publish CLI release
    needs: [build, sign_macos, notarize_macos]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged CLIs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_NOTARIZATION_RESULT: ${{ needs.notarize_macos.result }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          notes="docs/release-notes/${version}.md"
          test -f "$notes"
          cli_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$tag" = "v${cli_version}"

          archives=(
            "bitgarth-cli-${tag}-linux-x86_64-gnu.tar.gz"
            "bitgarth-cli-${tag}-windows-x86_64-msvc.zip"
          )
          macos_archive="bitgarth-cli-${tag}-macos-aarch64.tar.gz"
          macos_available=false
          if [[ -f "dist/${macos_archive}" ]]; then
            archives+=("$macos_archive")
            macos_available=true
          fi
          mapfile -t archives < <(
            printf '%s\n' "${archives[@]}" | LC_ALL=C sort
          )
          expected="$(printf '%s\n' "${archives[@]}")"
          actual="$(
            find dist -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )"
          if [[ "$actual" != "$expected" ]]; then
            printf 'expected assets:\n%s\nactual assets:\n%s\n' \
              "$expected" "$actual" >&2
            exit 1
          fi

          github_notes="$(mktemp)"
          {
            if [[ "$macos_available" == "true" &&
                  "$MACOS_NOTARIZATION_RESULT" != "success" ]]; then
              printf '%s\n' \
                '> [!WARNING]' \
                '> The macOS downloads are signed but have not yet completed Apple' \
                '> notarization. Gatekeeper may prevent them from opening.' \
                ''
            fi
            printf '%s\n\n' '> These release notes describe the BitGarth application. See the [installation options](https://bitgarth.app/#install) or build the app from source. The platform-specific downloads below contain the BitGarth CLI, a companion command-line client for a BitGarth server.'
            cat "$notes"
          } > "$github_notes"

          (
            cd dist
            sha256sum "${archives[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          assets=()
          for archive in "${archives[@]}"; do
            assets+=("dist/${archive}")
          done
          assets+=(dist/SHA256SUMS)

          if release_draft="$(
            gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            gh release edit "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$github_notes"
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "$tag" \
              --notes-file "$github_notes"
            release_draft=true
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          if [[ "$release_draft" == "true" ]]; then
            gh release edit "$tag" --draft=false
          fi

          if [[ "$macos_available" != "true" ]]; then
            echo '::error::macOS signing did not produce a release archive. Linux and Windows were published. Fix signing, then use “Re-run failed jobs” on this workflow.'
            exit 1
          fi
          if [[ "$MACOS_NOTARIZATION_RESULT" != "success" ]]; then
            echo '::error::macOS notarization is incomplete. The signed CLI was published with a warning. Wait for Apple, then use “Re-run failed jobs” on this workflow.'
            exit 1
          fi
