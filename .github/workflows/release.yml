name: CLI and Web Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.product }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        product: [cli, web]
        platform: [linux, macos, windows]
        include:
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64-gnu
            artifact_prefix: ""
            allow_failure: false
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            artifact_prefix: unsigned-
            allow_failure: true
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64-msvc
            artifact_prefix: ""
            allow_failure: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.product }}-${{ matrix.target }}

      - name: Test CLI
        if: matrix.product == 'cli'
        run: cargo test --locked -p bitgarth-cli

      - name: Build CLI
        if: matrix.product == 'cli'
        run: cargo build --locked --release -p bitgarth-cli --target ${{ matrix.target }}

      - name: Install matching Dioxus CLI
        if: matrix.product == 'web'
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          dx_version="$(sed -n 's/^dioxus.*version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          dx_dir="$RUNNER_TEMP/dioxus-cli"
          mkdir -p "$dx_dir"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/dx.zip" \
            "https://github.com/DioxusLabs/dioxus/releases/download/v${dx_version}/dx-${{ matrix.target }}.zip"
          unzip -q "$RUNNER_TEMP/dx.zip" -d "$dx_dir"
          chmod +x "$dx_dir"/dx*
          echo "$dx_dir" >> "$GITHUB_PATH"

      - name: Install Linux web dependencies
        if: matrix.product == 'web' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Configure Windows dependency cache
        if: matrix.product == 'web' && runner.os == 'Windows'
        id: vcpkg
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "path=$cache" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Cache Windows web dependencies
        if: matrix.product == 'web' && runner.os == 'Windows'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.vcpkg.outputs.path }}
          key: vcpkg-${{ matrix.target }}-openssl-${{ steps.vcpkg.outputs.revision }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: |
            vcpkg-${{ matrix.target }}-openssl-${{ steps.vcpkg.outputs.revision }}-

      - name: Install Windows web dependencies
        if: matrix.product == 'web' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV

      - name: Build web
        if: matrix.product == 'web'
        run: dx build --web --release --debug-symbols=false --locked

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p package
          ext=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then ext=".exe"; fi
          if [[ "${{ matrix.product }}" == "cli" ]]; then
            cp "target/${{ matrix.target }}/release/bitgarth${ext}" package/
          else
            cp "target/dx/bitgarth-app/release/web/server${ext}" "package/bitgarth-web${ext}"
            cp -R target/dx/bitgarth-app/release/web/public package/public
            mkdir -p package/assets/catalog
            cp assets/catalog/unsynced_asset_catalog.json package/assets/catalog/
          fi

      - name: Stage Windows crypto runtime
        if: matrix.product == 'web' && runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:OPENSSL_DIR/bin/*crypto*.dll" package/

      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="bitgarth-${{ matrix.product }}-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz"
          mkdir -p dist
          if [[ "${{ matrix.product }}" == "cli" ]]; then
            tar -C package -czf "dist/${asset}" bitgarth
            test "$(tar -tzf "dist/${asset}")" = "bitgarth"
          else
            tar -C package -czf "dist/${asset}" bitgarth-web public assets
          fi
          extract_dir="$(mktemp -d)"
          tar -xzf "dist/${asset}" -C "${extract_dir}"
          if [[ "${{ matrix.product }}" == "cli" ]]; then
            test -x "${extract_dir}/bitgarth"
          else
            platform="linux/x86_64"
            if [[ "$RUNNER_OS" == "macOS" ]]; then platform="macos/aarch64"; fi
            expected_version="$GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              expected_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "bitgarth-app"))')"
            fi
            python3 tests/test_web_release.py "$extract_dir" --check-metadata \
              --expected-platform "$platform" --expected-version "$expected_version"
          fi

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "bitgarth-${{ matrix.product }}-$env:GITHUB_REF_NAME-${{ matrix.asset_suffix }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "package/*" -DestinationPath "dist/$asset"
          $extractDir = Join-Path $env:RUNNER_TEMP "release-check"
          Expand-Archive -LiteralPath "dist/$asset" -DestinationPath $extractDir
          if ("${{ matrix.product }}" -eq "cli") {
            $entries = @(tar -tf "dist/$asset")
            if ($entries.Count -ne 1 -or $entries[0] -ne "bitgarth.exe") {
              throw "unexpected ZIP contents: $entries"
            }
          } else {
            $expectedVersion = $env:GITHUB_REF_NAME
            if ($env:GITHUB_REF_TYPE -ne "tag") {
              $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $expectedVersion = ($metadata.packages | Where-Object name -eq "bitgarth-app").version
            }
            python tests/test_web_release.py $extractDir --check-metadata `
              --expected-platform windows/x86_64 --expected-version $expectedVersion
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packaged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}${{ matrix.product }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  sign_macos:
    name: Sign macOS ${{ matrix.product }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: cli
            binary: bitgarth
          - product: web
            binary: bitgarth-web
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - name: Download unsigned macOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.product }}-aarch64-apple-darwin
          path: unsigned

      - name: Import macOS signing certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          keychain: bitgarth-signing
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Sign macOS binary
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="bitgarth-signing.keychain"
          identity="Developer ID Application: FernTrail B.V. (4UJZ75B7VG)"

          security find-identity -v -p codesigning "$keychain_path"

          archive="$(find unsigned -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          work_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$work_dir"
          binary="$work_dir/${{ matrix.binary }}"
          test -x "$binary"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --identifier tech.ferntrail.bitgarth.${{ matrix.product }} \
            --keychain "$keychain_path" \
            --sign "$identity" \
            "$binary"
          codesign --verify --strict --verbose=4 "$binary"

          mkdir -p signed
          contents=("${{ matrix.binary }}")
          if [[ "${{ matrix.product }}" == "web" ]]; then contents+=(public assets); fi
          tar -C "$work_dir" -czf "signed/$(basename "$archive")" "${contents[@]}"

      - name: Upload signed macOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.product }}-aarch64-apple-darwin
          path: signed/*
          if-no-files-found: error
          retention-days: 14

  notarize_macos:
    name: Notarize macOS ${{ matrix.product }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: cli
            binary: bitgarth
          - product: web
            binary: bitgarth-web
    needs: sign_macos
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - name: Download signed macOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.product }}-aarch64-apple-darwin
          path: signed

      - name: Notarize macOS binary
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$api_key_path"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"

          archive="$(find signed -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          work_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$work_dir"
          binary="$work_dir/${{ matrix.binary }}"
          test -x "$binary"

          if codesign --verify \
            --verbose=4 \
            --test-requirement '=notarized' \
            --check-notarization \
            "$binary"
          then
            echo "Apple notarization ticket is already available"
            exit 0
          fi

          submission="$RUNNER_TEMP/bitgarth-notary.zip"
          submission_result="$RUNNER_TEMP/bitgarth-notary-submission.json"
          notary_log="$RUNNER_TEMP/bitgarth-notary-log.json"
          ditto -c -k --keepParent "$binary" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$submission_result"
          cat "$submission_result"
          submission_id="$(plutil -extract id raw -o - "$submission_result")"

          set +e
          xcrun notarytool wait "$submission_id" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          notarization_exit=$?
          set -e

          if ! xcrun notarytool log "$submission_id" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" > "$notary_log"; then
            echo "::error::Unable to verify notarization log for $submission_id"
            exit 1
          fi
          cat "$notary_log"
          if (( notarization_exit != 0 )); then
            exit "$notarization_exit"
          fi

          # Apple's acceptance record is authoritative; ticket lookup can fail
          # independently on the runner, even for a successfully notarized binary.
          codesign --verify --strict --verbose=4 "$binary"
          binary_cdhash="$(codesign --display --verbose=4 "$binary" 2>&1 | sed -n 's/^CDHash=//p')"
          test -n "$binary_cdhash"
          python3 - "$notary_log" "$submission_id" "$submission" "$binary_cdhash" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          log_path, submission_id, archive, cdhash = sys.argv[1:]
          report = json.loads(Path(log_path).read_text())
          if report.get("status") != "Accepted" or report.get("jobId") != submission_id:
              sys.exit("Notarization log does not confirm this submission was accepted")
          if report.get("sha256") != hashlib.sha256(Path(archive).read_bytes()).hexdigest():
              sys.exit("Notarization log does not match the submitted archive")
          if not any(ticket.get("cdhash") == cdhash for ticket in report.get("ticketContents", [])):
              sys.exit("Notarization ticket does not cover the signed binary")
          print("Apple accepted the submitted archive and signed binary")
          PY

          if ! codesign --verify \
            --verbose=4 \
            --test-requirement '=notarized' \
            --check-notarization \
            "$binary"
          then
            echo '::warning::Apple accepted this exact signed binary, but the runner could not retrieve its notarization ticket. See the verified notarization log above.'
          fi

  release:
    name: Publish release
    needs: [build, sign_macos, notarize_macos]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged releases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{cli,web}-*"
          path: dist
          merge-multiple: true

      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_NOTARIZATION_RESULT: ${{ needs.notarize_macos.result }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          notes="docs/release-notes/${version}.md"
          test -f "$notes"
          cli_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$tag" = "v${cli_version}"

          archives=(
            "bitgarth-cli-${tag}-linux-x86_64-gnu.tar.gz"
            "bitgarth-cli-${tag}-windows-x86_64-msvc.zip"
            "bitgarth-web-${tag}-linux-x86_64-gnu.tar.gz"
            "bitgarth-web-${tag}-windows-x86_64-msvc.zip"
          )
          macos_available=true
          macos_any_available=false
          for product in cli web; do
            macos_archive="bitgarth-${product}-${tag}-macos-aarch64.tar.gz"
            if [[ -f "dist/${macos_archive}" ]]; then
              archives+=("$macos_archive")
              macos_any_available=true
            else
              macos_available=false
            fi
          done
          mapfile -t archives < <(
            printf '%s\n' "${archives[@]}" | LC_ALL=C sort
          )
          expected="$(printf '%s\n' "${archives[@]}")"
          actual="$(
            find dist -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )"
          if [[ "$actual" != "$expected" ]]; then
            printf 'expected assets:\n%s\nactual assets:\n%s\n' \
              "$expected" "$actual" >&2
            exit 1
          fi

          github_notes="$(mktemp)"
          {
            if [[ "$macos_any_available" == "true" &&
                  "$MACOS_NOTARIZATION_RESULT" != "success" ]]; then
              printf '%s\n' \
                '> [!WARNING]' \
                '> The macOS downloads are signed but have not yet completed Apple' \
                '> notarization. Gatekeeper may prevent them from opening.' \
                ''
            fi
            printf '%s\n\n' '> The bitgarth-web downloads contain the BitGarth web server and its required browser assets and asset catalog. Extract the entire archive and run bitgarth-web (bitgarth-web.exe on Windows) from the extracted directory. The bitgarth-cli downloads contain the companion command-line client for a BitGarth server. See the [web server download instructions](https://github.com/BitGarth/bitgarth#web-server-downloads) for runtime requirements and the [installation options](https://bitgarth.app/#install) for other ways to run BitGarth.'
            if [[ "$macos_any_available" == "true" ]]; then
              printf '%s\n' \
                '> [!IMPORTANT]' \
                '> **Do not double-click the macOS downloads in Finder — run them from' \
                '> your terminal.** These are command-line programs, not app bundles, so' \
                '> Finder refuses them with "Apple could not verify" and offers no way to' \
                '> continue. Instead, in your terminal, `cd` to the extracted directory and' \
                '> run `./bitgarth` (or `./bitgarth-web`). macOS shows a one-time' \
                '> "downloaded from the Internet" prompt: click **Open**. After that the' \
                '> binary runs normally from anywhere, including from Finder. Both macOS' \
                '> downloads are signed and notarized by FernTrail B.V.; Finder refuses' \
                '> every bare command-line binary regardless of notarization.' \
                ''
            fi
            cat "$notes"
          } > "$github_notes"

          (
            cd dist
            sha256sum "${archives[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          assets=()
          for archive in "${archives[@]}"; do
            assets+=("dist/${archive}")
          done
          assets+=(dist/SHA256SUMS)

          if release_draft="$(
            gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            gh release edit "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$github_notes"
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "$tag" \
              --notes-file "$github_notes"
            release_draft=true
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          if [[ "$release_draft" == "true" ]]; then
            gh release edit "$tag" --draft=false
          fi

          if [[ "$macos_available" != "true" ]]; then
            echo '::error::macOS signing did not produce both release archives. Available archives were published. Fix signing, then use “Re-run failed jobs” on this workflow.'
            exit 1
          fi
          if [[ "$MACOS_NOTARIZATION_RESULT" != "success" ]]; then
            echo '::error::macOS notarization is incomplete. Signed archives were published with a warning. Wait for Apple, then use “Re-run failed jobs” on this workflow.'
            exit 1
          fi
