name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Run all tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install verification tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install \
            --git https://github.com/rtk-ai/rtk \
            --rev b34be37caf3796b69a50952a28e60e32b5daad43 \
            --locked \
            rtk

      - name: Install matching Dioxus CLI
        run: |
          dioxus_version="$(
            cargo metadata --format-version 1 --locked |
              jq -er '
                [.packages[] | select(.name == "dioxus") | .version]
                | unique
                | if length == 1
                  then .[0]
                  else error("expected exactly one Dioxus version")
                  end
              '
          )"
          cargo install dioxus-cli --version "$dioxus_version" --locked

      - name: Check migrations against previous public main
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: ./scripts/check-migrations-immutable "${{ github.event.before }}"

      - name: Run full verification
        run: ./scripts/verify-full
