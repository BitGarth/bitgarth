name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HLEDGER_VERSION: "1.99.6"
  HLEDGER_LINUX_X64_SHA256: "c71ee88571ef2595ba11b84ba3e38f50fa930c85956a805155790f24ad318e15"

jobs:
  release-tools:
    name: Release tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release automation without publishing
        run: |
          python3 -m unittest discover -s tests -p 'test_release_*.py' -q
          python3 -m unittest discover -s tests -p 'test_snap_packaging.py' -q
          bash tests/test_docker_build.sh

  verify:
    name: Run all tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install hledger
        run: |
          archive="${RUNNER_TEMP}/hledger-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/hledgerorg/hledger/releases/download/${HLEDGER_VERSION}/hledger-linux-x64.tar.gz"
          echo "${HLEDGER_LINUX_X64_SHA256}  ${archive}" | sha256sum --check -
          sudo tar -xzf "$archive" -C /usr/local/bin hledger
          installed_version="$(hledger --version | awk 'NR == 1 { gsub(/,$/, "", $2); print $2 }')"
          test "$installed_version" = "$HLEDGER_VERSION"

      - name: Install verification tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          # RTK v1.2.0
          cargo install \
            --git https://github.com/rtk-ai/rtk \
            --rev e288a18c04452fd26192f59132e5324a8bb6924d \
            --locked \
            rtk

      - name: Install matching Dioxus CLI
        run: bash scripts/release/install-dioxus.sh x86_64-unknown-linux-gnu

      - name: Check migrations against previous public main
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: ./scripts/check-migrations-immutable "${{ github.event.before }}"

      - name: Run full verification
        run: ./scripts/verify-full
