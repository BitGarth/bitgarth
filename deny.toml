[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# unmaintained is a scope selector (not severity level) in cargo-deny 0.20.2.
# "workspace" = only unmaintained advisories affecting DIRECT dependencies.
# Transitive unmaintained crates (gtk-rs GTK3 via dioxus-desktop->wry,
# proc-macro-error, paste, fxhash) produce no output—invisible, not warnings.
# If any transitive unmaintained becomes a DIRECT dependency, it will
# hard-fail the check (unmaintained findings are errors when in-scope).
# To audit the full list: temporarily set unmaintained = "all" and run
# `cargo deny check advisories`.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "NCSA",
    "Apache-2.0 WITH LLVM-exception",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
